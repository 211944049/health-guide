# ============================================================================
# costlifehealth.com —— 阿里云香港轻量服务器的 Nginx 配置（HTTPS 版）
#
# 放到：/etc/nginx/conf.d/costlifehealth.conf
#
# 改完执行：nginx -t && systemctl reload nginx
#
# 为什么放 conf.d 而不是 sites-enabled：
#   Debian/Ubuntu 的 nginx.conf 会把 conf.d/*.conf 和 sites-enabled/* 都 include
#   在 http{} 里。用 conf.d 就少一步建软链接，而且下面的 `map` 必须在 http
#   上下文，放在同一个文件里最省事。
# ============================================================================

# ---------------------------------------------------------------------------
# 缓存策略集中在一处
#
# 为什么用 map 而不是给每个 location 写 add_header：
#   Nginx 的 add_header 有一个很坑的继承规则 —— **子级 location 里只要出现
#   一个 add_header，父级的全部 add_header 都会失效**。
#   所以「/_astro/ 缓存一年」这种需求如果用 location 写，
#   那个 location 里的安全头（nosniff 等）就会丢失。
#   用 map 算出一个变量、在 server 级只写一次 add_header，就没有这个问题。
# ---------------------------------------------------------------------------
map $uri $cache_control {
    default                                      "public, max-age=300, stale-while-revalidate=86400";

    # Astro 产出的资源文件名带内容哈希，可以永久缓存
    ~^/_astro/                                   "public, max-age=31536000, immutable";

    # Pagefind 既有带哈希的分片，也有固定文件名的 pagefind.js，只给一小时
    ~^/pagefind/                                 "public, max-age=3600";

    # 分享图（144 张 PNG），一周
    ~^/og/                                       "public, max-age=604800";

    # 订阅源与站点地图，一小时
    ~^/(rss\.xml|sitemap[^/]*\.xml|robots\.txt)$  "public, max-age=3600";
}

# ---------------------------------------------------------------------------
# HTTP：除了 ACME 验证，全部跳转 HTTPS
#
# `/.well-known/acme-challenge/` 必须留在 80 端口且不过期跳转，
# 否则 acme.sh 的证书续期会失败（续期每 60 天自动跑一次）。
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name costlifehealth.com www.costlifehealth.com;

    location /.well-known/acme-challenge/ {
        root /var/www/costlifehealth/current;
    }

    location / {
        return 301 https://costlifehealth.com$request_uri;
    }
}

# ---------------------------------------------------------------------------
# www → 裸域名（canonical 统一）
#
# 站点所有页面的 canonical 都指向 https://costlifehealth.com，所以 www 必须
# 301 过去，否则同一份内容会有两个可访问地址，对收录不利。
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.costlifehealth.com;

    ssl_certificate     /etc/nginx/ssl/costlifehealth.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/costlifehealth.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    return 301 https://costlifehealth.com$request_uri;
}

# ---------------------------------------------------------------------------
# HTTPS
# ---------------------------------------------------------------------------
server {
    # nginx 1.18 不支持 `http2 on;`，必须写成 listen 上的参数
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name costlifehealth.com;

    ssl_certificate     /etc/nginx/ssl/costlifehealth.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/costlifehealth.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # `current` 是一个软链接，指向 releases/<时间戳>/，这样部署可以原子切换。
    # 站点是纯静态的：529 个文件、约 12 MB。
    root /var/www/costlifehealth/current;
    index index.html;

    charset utf-8;

    # -----------------------------------------------------------------------
    # 目录式 URL（这一条是整个配置里最关键的）
    #
    # Astro 的产物是 entry/xxx/index.html，而对外 URL 是 /entry/xxx/。
    # 只靠 root 是不会自动找 index.html 的，必须让 try_files 处理：
    #   $uri     → /entry/xxx/ 不是文件，跳过
    #   $uri/    → 是目录，Nginx 内部转到 index.html
    # 访问 /entry/xxx（无尾斜杠）时，$uri/ 命中目录，Nginx 自动 301 到带斜杠的
    # 地址 —— 这与 astro.config.mjs 里 trailingSlash: 'ignore' 的行为一致。
    #
    # 如果漏了这条，149 个词条 URL 会全部 404。
    # -----------------------------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # -----------------------------------------------------------------------
    # 压缩
    #
    # 站点压缩前的传输量：HTML 25 KB + CSS 37 KB。
    # gzip 之后实测 7.6 KB，对跨境链路来说这一步省的是实打实的字节。
    # -----------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # -----------------------------------------------------------------------
    # 响应头
    # -----------------------------------------------------------------------

    # 缓存：由上面的 map 决定
    add_header Cache-Control $cache_control always;

    # 安全头：与原来 Cloudflare Pages 的 public/_headers 保持一致
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # HSTS。先给一年；如果将来要回退到 Cloudflare，记得把这个头去掉，
    # 否则浏览器会记住一年内只能走 HTTPS。
    add_header Strict-Transport-Security "max-age=31536000" always;

    server_tokens off;

    access_log /var/log/nginx/costlifehealth.access.log;
    error_log  /var/log/nginx/costlifehealth.error.log;
}
