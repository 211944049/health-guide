name: Deploy to GitHub Pages

# 只负责发布，不负责构建。
#
# 为什么不在 CI 里构建：
#   1. 构建要跑 29 道质量闸门，其中 check-og 校验 public/og/ 里的 144 张分享图，
#      而这个目录被 .gitignore 排除了，CI 环境里根本不存在 → 必然失败。
#   2. 站点的构建依赖本机已有的 node_modules 与已生成的 og 图。
#   3. 所以仓库里保存的是「已通过全部闸门」的 dist，CI 只把它发出去。
#
# 更新流程：
#   本机 run.cmd build  →  把 dist 同步进仓库  →  提交推送
#   →  这个工作流自动发布

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanity check the committed dist
        run: |
          set -e
          test -f dist/index.html          || { echo "缺少 dist/index.html"; exit 1; }
          test -f dist/CNAME               || { echo "缺少 dist/CNAME（自定义域名会失效）"; exit 1; }
          test -f dist/.nojekyll           || { echo "缺少 dist/.nojekyll（/_astro/ 会被 Jekyll 处理）"; exit 1; }
          test -f dist/sitemap-0.xml       || { echo "缺少 sitemap"; exit 1; }
          test -f dist/404.html            || { echo "缺少 404 页"; exit 1; }
          echo "dist 文件数：$(find dist -type f | wc -l)"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
